  <style>
    * { box-sizing: border-box; }

    .navigation-inner { max-width: 1240px; margin: auto; padding: 12px clamp(10px, 3vw, 30px); }

    button { min-height: 44px; padding: 8px 15px; border: 1px solid #b7d0bf; border-radius: 9px;
      background: #f1f7f3; color: inherit; font: inherit; font-weight: 650; cursor: pointer; }
    button[aria-selected="true"] { background: #145735; border-color: #145735; color: #fff; }
    button:focus-visible { outline: 3px solid #2680c2; outline-offset: 2px; }
    iframe { display: block; border: 0; width: 100%; height: 100vh; }

  </style>
</head>

      <button type="button" role="tab" id="tab-papaya" aria-controls="panel-papaya" aria-selected="false" tabindex="-1">มะละกอ</button>

  <main>

  <iframe title="ผังระบบน้ำ เลมอนยูเรก้า / มะนาว" srcdoc="&lt;!DOCTYPE html&gt;
&lt;html lang=&quot;th&quot;&gt;
&lt;head&gt;
  &lt;meta charset=&quot;UTF-8&quot; /&gt;
  &lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot; /&gt;
  &lt;title&gt;ผังออกแบบระบบน้ำพืชหลัก เลมอนยูเรก้า (Lemon / มะนาวเหลือง) และ มะนาว (Lime)&lt;/title&gt;
  &lt;style&gt;
    :root {
      --bg: #f4f7f5;
      --card: #ffffff;
      --primary: #1b6b43;
      --primary-light: #e6f3ec;
      --secondary: #0284c7;
      --secondary-light: #e0f2fe;
      --accent: #d97706;
      --accent-light: #fef3c7;
      --text: #1e293b;
      --muted: #64748b;
      --border: #cbd5e1;
    }
    * { box-sizing: border-box; font-family: &#x27;Sarabun&#x27;, &#x27;Segoe UI&#x27;, Tahoma, sans-serif; }
    body {
      margin: 0;
      padding: 20px;
      background: var(--bg);
      color: var(--text);
    }
    .container {
      max-width: 1080px;
      margin: 0 auto;
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      padding: 24px;
    }
    header {
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 16px;
      margin-bottom: 20px;
    }
    h1 {
      margin: 0 0 6px 0;
      font-size: 1.5rem;
      color: var(--primary);
    }
    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      margin-bottom: 16px;
      background: #f8fafc;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
    }
    .control-group label {
      display: block;
      font-weight: 700;
      font-size: 0.84rem;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .crop-select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      font: inherit;
      font-size: 0.88rem;
    }
    .btn-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    button {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text);
      transition: all 0.15s ease;
    }
    button:hover { background: #f1f5f9; }
    button.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    button.active.blue {
      background: var(--secondary);
      border-color: var(--secondary);
    }
    button.active.amber {
      background: var(--accent);
      border-color: var(--accent);
    }

    /* Companion Plant Menu Bar */
    .plant-menu-box {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .plant-menu-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }
    .plant-menu-header strong {
      font-size: 0.98rem;
      color: #92400e;
    }
    .quick-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .quick-btn {
      flex: initial;
      padding: 5px 11px;
      font-size: 0.82rem;
      border-radius: 6px;
    }
    .plant-chips {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(165px, 1fr));
      gap: 8px;
    }
    .plant-option {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }
    .plant-count input {
      width: 5rem;
      padding: 5px;
      font: inherit;
    }
    .plant-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #fff;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
      transition: all 0.15s ease;
      text-align: left;
    }
    .plant-chip.selected {
      border-color: #d97706;
      background: #fef3c7;
      color: #78350f;
      box-shadow: 0 0 0 1px #d97706;
    }
    .chip-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .canvas-wrapper {
      background: #eef2f0;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      overflow-x: auto;
    }
    svg {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px 16px;
      margin-top: 14px;
      font-size: 0.84rem;
      color: var(--text);
    }
    .companion-legend { display: contents; }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }
    .grid-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }
    .specs-card {
      background: var(--primary-light);
      border-left: 4px solid var(--primary);
      padding: 16px 18px;
      border-radius: 8px;
    }
    .specs-card.blue-theme {
      background: var(--secondary-light);
      border-left-color: var(--secondary);
    }
    .specs-card.amber-theme {
      background: var(--accent-light);
      border-left-color: var(--accent);
    }
    .specs-card h3 {
      margin: 0 0 8px 0;
      font-size: 1.05rem;
    }
    .specs-card ul {
      margin: 0;
      padding-left: 18px;
      line-height: 1.65;
      font-size: 0.92rem;
    }
    .report-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 14px;
    }
    .report-actions button {
      flex: 0 1 auto;
      padding: 10px 16px;
      color: #fff;
      border-color: var(--primary);
      background: var(--primary);
    }
    .report-actions button:hover { background: #145735; }
    .report-header { display: none; }

    @page {
      size: A4 portrait;
      margin: 12mm;
    }
    @media print {
      * {
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }
      body { padding: 0; background: #fff; }
      .container {
        max-width: none;
        padding: 0;
        border-radius: 0;
        box-shadow: none;
      }
      .container &gt; header, .controls, .plant-menu-box { display: none; }
      .report-header {
        display: block;
        margin: 0 0 4mm;

        border-radius: 3mm;

        background: #145735;

      .report-header p { margin: 0; font-size: 11pt; }
      .canvas-wrapper {
        padding: 3mm;
        overflow: visible;
        break-inside: avoid;
      }
      #blueprint { width: 100%; height: auto; }
      .legend { gap: 2mm 4mm; margin-top: 2mm; font-size: 9pt; }
      .grid-cards {
        grid-template-columns: 36% minmax(0, 1fr);
        gap: 3mm;
        margin-top: 4mm;
        align-items: start;
        break-inside: avoid;
      }
      .specs-card { padding: 3mm; }
      .specs-card h3 { font-size: 11pt; margin-bottom: 1.5mm; }
      .specs-card ul { font-size: 9.5pt; line-height: 1.45; }
      .specs-card li + li { margin-top: 1mm; }
    }
  &lt;/style&gt;

&lt;body&gt;
  &lt;div class=&quot;container&quot;&gt;
    &lt;header&gt;
      &lt;h1&gt;ผังออกแบบระบบน้ำพืชหลัก &lt;strong&gt;เลมอนยูเรก้า (Lemon / มะนาวเหลือง)&lt;/strong&gt; และ &lt;strong&gt;มะนาว (Lime)&lt;/strong&gt;&lt;/h1&gt;
      &lt;p class=&quot;subtitle&quot;&gt;แบบแปลนมาตราส่วนจริง (กว้าง 100 ซม. × ยาว 230 ซม.) — เพิ่มตัวเลือกพืชแซมสมุนไพร ผักใบ และพืชบำรุงดิน&lt;/p&gt;
      &lt;div class=&quot;report-actions&quot;&gt;
        &lt;button type=&quot;button&quot; id=&quot;export-pdf&quot;&gt;ส่งออก PDF&lt;/button&gt;
      &lt;/div&gt;
    &lt;/header&gt;
    &lt;section class=&quot;report-header&quot;&gt;
      &lt;h1&gt;ผังระบบน้ำและการปลูกพืชแซม&lt;/h1&gt;
      &lt;p id=&quot;report-summary&quot;&gt;&lt;/p&gt;
    &lt;/section&gt;

    &lt;div class=&quot;controls&quot;&gt;
      &lt;div class=&quot;control-group&quot;&gt;
        &lt;label for=&quot;crop-select&quot;&gt;1. ชนิดต้นหลัก&lt;/label&gt;
        &lt;select id=&quot;crop-select&quot; class=&quot;crop-select&quot; onchange=&quot;setCrop(this.value)&quot;&gt;
          &lt;option value=&quot;lemon&quot;&gt;เลมอนยูเรก้า (Lemon / มะนาวเหลือง)&lt;/option&gt;
          &lt;option value=&quot;lime&quot;&gt;มะนาว (Lime)&lt;/option&gt;
        &lt;/select&gt;
      &lt;/div&gt;
      &lt;div class=&quot;control-group&quot;&gt;
        &lt;label&gt;2. รูปแบบระบบน้ำ&lt;/label&gt;
        &lt;div class=&quot;btn-group&quot;&gt;
          &lt;button id=&quot;sys-drip&quot; class=&quot;active&quot; onclick=&quot;setSystem(&#x27;drip&#x27;)&quot;&gt;น้ำหยด&lt;/button&gt;
          &lt;button id=&quot;sys-360&quot; onclick=&quot;setSystem(&#x27;360&#x27;)&quot;&gt;สปริงเกอร์ 360°&lt;/button&gt;
          &lt;button id=&quot;sys-180&quot; onclick=&quot;setSystem(&#x27;180&#x27;)&quot;&gt;สปริงเกอร์ 180°&lt;/button&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;control-group&quot;&gt;
        &lt;label&gt;3. จำนวนต้นหลัก&lt;/label&gt;
        &lt;div class=&quot;btn-group&quot;&gt;
          &lt;button id=&quot;tree-1&quot; class=&quot;active&quot; onclick=&quot;setTrees(1)&quot;&gt;1 ต้น (กึ่งกลาง)&lt;/button&gt;
          &lt;button id=&quot;tree-2&quot; onclick=&quot;setTrees(2)&quot;&gt;2 ต้น (ระยะ 115 ซม.)&lt;/button&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;control-group&quot; id=&quot;stage-group&quot;&gt;
        &lt;label&gt;4. ระยะต้น (เฉพาะน้ำหยด)&lt;/label&gt;
        &lt;div class=&quot;btn-group&quot;&gt;
          &lt;button id=&quot;stage-young&quot; class=&quot;active&quot; onclick=&quot;setStage(&#x27;young&#x27;)&quot;&gt;ปลูกใหม่ (2 หัว)&lt;/button&gt;
          &lt;button id=&quot;stage-mature&quot; onclick=&quot;setStage(&#x27;mature&#x27;)&quot;&gt;ต้นโต (4 หัว)&lt;/button&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;!-- Menu for selecting companion plants --&gt;
    &lt;div class=&quot;plant-menu-box&quot;&gt;
      &lt;div class=&quot;plant-menu-header&quot;&gt;
        &lt;strong&gt;5. เมนูเลือกชนิดพืชแซม (กดเลือก/ยกเลิกได้ตามต้องการ)&lt;/strong&gt;
        &lt;div class=&quot;quick-actions&quot;&gt;
          &lt;button class=&quot;quick-btn&quot; onclick=&quot;selectPreset(&#x27;none&#x27;)&quot;&gt;ไม่ปลูกพืชแซม&lt;/button&gt;
          &lt;button class=&quot;quick-btn&quot; onclick=&quot;selectPreset(&#x27;herbs&#x27;)&quot;&gt;สมุนไพรไล่แมลง&lt;/button&gt;
          &lt;button class=&quot;quick-btn&quot; onclick=&quot;selectPreset(&#x27;soil&#x27;)&quot;&gt;บำรุงดิน / คุมดิน&lt;/button&gt;
          &lt;button class=&quot;quick-btn&quot; onclick=&quot;selectPreset(&#x27;all&#x27;)&quot;&gt;เลือกทั้งหมด&lt;/button&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;plant-chips&quot; id=&quot;plant-chips&quot;&gt;&lt;/div&gt;
      &lt;small&gt;กรอกจำนวนต้นของแต่ละชนิดที่เลือก จุดสี 1 จุดแทนพืชแซม 1 ต้น ตำแหน่งในผังเป็นตัวอย่างการจัดวาง&lt;/small&gt;
    &lt;/div&gt;

    &lt;div class=&quot;canvas-wrapper&quot;&gt;
      &lt;svg id=&quot;blueprint&quot; viewBox=&quot;0 0 840 440&quot; xmlns=&quot;http://www.w3.org/2000/svg&quot;&gt;&lt;/svg&gt;
      &lt;div class=&quot;legend&quot;&gt;
        &lt;div class=&quot;legend-item&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:#16a34a; border:2px solid #fff;&quot;&gt;&lt;/span&gt; &lt;span id=&quot;crop-legend&quot;&gt;เลมอนยูเรก้า (Lemon / มะนาวเหลือง)&lt;/span&gt;&lt;/div&gt;
        &lt;div id=&quot;companion-legend&quot; class=&quot;companion-legend&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;legend-item&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:#1e293b;&quot;&gt;&lt;/span&gt; ท่อ PE 16/20 มม.&lt;/div&gt;
        &lt;div class=&quot;legend-item&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:#0284c7;&quot;&gt;&lt;/span&gt; หัวน้ำหยด / สปริงเกอร์&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;grid-cards&quot;&gt;
      &lt;div id=&quot;specs&quot; class=&quot;specs-card&quot;&gt;&lt;/div&gt;
      &lt;div id=&quot;companion-specs&quot; class=&quot;specs-card amber-theme&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;script&gt;
    const PLANT_CATALOG = [
      {
        id: &#x27;marigold&#x27;,
        name: &#x27;ดาวเรือง&#x27;,
        color: &#x27;#f59e0b&#x27;,
        role: &#x27;ลดไส้เดือนฝอยในดิน และล่อแมลงตัวห้ำช่วยคุมเพลี้ย&#x27;
      },
      {
        id: &#x27;basil&#x27;,
        name: &#x27;โหระพา / กะเพรา&#x27;,
        color: &#x27;#10b981&#x27;,
        role: &#x27;กลิ่นหอมช่วยพรางใบอ่อนของต้นหลักจากแมลง เก็บยอดกินได้เรื่อยๆ&#x27;
      },
      {
        id: &#x27;mint&#x27;,
        name: &#x27;สะระแหน่&#x27;,
        color: &#x27;#34d399&#x27;,
        role: &#x27;คลุมผิวดินลดการระเหยของน้ำ รากตื้นไม่รบกวนรากของต้นหลัก&#x27;
      },
      {
        id: &#x27;veggies&#x27;,
        name: &#x27;ต้นหอม / ผักชี / สลัด&#x27;,
        color: &#x27;#84cc16&#x27;,
        role: &#x27;ผักอายุสั้น (30–45 วัน) เก็บไว ไม่แย่งปุ๋ยระยะยาว&#x27;
      },
      {
        id: &#x27;lemongrass&#x27;,
        name: &#x27;ตะไคร้หอม (มุมแปลง)&#x27;,
        color: &#x27;#0d9488&#x27;,
        role: &#x27;ปลูกเฉพาะมุมหัว-ท้ายแปลง ช่วยไล่แมลงรบกวนบางชนิด&#x27;
      },
      {
        id: &#x27;legume&#x27;,
        name: &#x27;ถั่วพุ่มเตี้ย / ถั่วเขียว&#x27;,
        color: &#x27;#a3e635&#x27;,
        role: &#x27;พืชตระกูลถั่วช่วยตรึงไนโตรเจนบำรุงดิน ตัดสับคลุมโคนได้&#x27;
      },
      {
        id: &#x27;gotukola&#x27;,
        name: &#x27;ผักโขม / บัวบก&#x27;,
        color: &#x27;#65a30d&#x27;,
        role: &#x27;คลุมดินบริเวณขอบหรือพื้นที่ว่าง รากตื้น เก็บเกี่ยวใช้ประโยชน์ได้&#x27;
      }
    ];

    const CROPS = {
      lemon: { name: &#x27;เลมอนยูเรก้า&#x27;, label: &#x27;เลมอนยูเรก้า (Lemon / มะนาวเหลือง)&#x27;, mapName: &#x27;เลมอน&#x27; },
      lime: { name: &#x27;มะนาว&#x27;, label: &#x27;มะนาว (Lime)&#x27;, mapName: &#x27;มะนาว&#x27; }
    };

    const state = {
      crop: &#x27;lemon&#x27;,
      system: &#x27;drip&#x27;,
      trees: 1,
      stage: &#x27;young&#x27;,
      selectedPlants: [&#x27;marigold&#x27;, &#x27;basil&#x27;],
      plantCounts: {}
    };

    const SCALE = 3;
    const BED_X = 80;
    const BED_Y = 60;
    const BED_W = 230 * SCALE;
    const BED_H = 100 * SCALE;

    function plantCount(id, defaultCount) {
      return state.plantCounts[id] ?? defaultCount;
    }

    function defaultPlantCount(id) {
      if (id === &#x27;marigold&#x27;) return 4;
      if (state.trees === 2 &amp;&amp; [&#x27;basil&#x27;, &#x27;mint&#x27;].includes(id)) return 1;
      return 2;
    }

    function setPlantCount(input, id) {
      if (input.validity.valid) {
        state.plantCounts[id] = input.valueAsNumber;
        render();
      }
    }

    function initPlantMenu() {
      const container = document.getElementById(&#x27;plant-chips&#x27;);
      container.innerHTML = PLANT_CATALOG.map(p =&gt; {
        const isSel = state.selectedPlants.includes(p.id);
        return `
          &lt;div class=&quot;plant-option&quot;&gt;
          &lt;button aria-pressed=&quot;${isSel}&quot; type=&quot;button&quot; id=&quot;chip-${p.id}&quot; class=&quot;plant-chip ${isSel ? &#x27;selected&#x27; : &#x27;&#x27;}&quot; onclick=&quot;togglePlant(&#x27;${p.id}&#x27;)&quot;&gt;
            &lt;span class=&quot;chip-dot&quot; style=&quot;background:${p.color};&quot;&gt;&lt;/span&gt;
            &lt;span&gt;${isSel ? &#x27;✓ &#x27; : &#x27;+ &#x27;}${p.name}&lt;/span&gt;
          &lt;/button&gt;
          ${isSel ? `
            &lt;label class=&quot;plant-count&quot;&gt;
              &lt;input type=&quot;number&quot; min=&quot;1&quot; max=&quot;9999&quot; step=&quot;1&quot; required
                aria-label=&quot;จำนวนต้น ${p.name}&quot; value=&quot;${plantCount(p.id, defaultPlantCount(p.id))}&quot;
                oninput=&quot;setPlantCount(this, &#x27;${p.id}&#x27;)&quot;
                onblur=&quot;if (!this.validity.valid) this.value = plantCount(&#x27;${p.id}&#x27;, defaultPlantCount(&#x27;${p.id}&#x27;))&quot;&gt;
              ต้น
            &lt;/label&gt;
          ` : &#x27;&#x27;}
          &lt;/div&gt;
        `;
      }).join(&#x27;&#x27;);
    }

    function togglePlant(id) {
      const idx = state.selectedPlants.indexOf(id);
      if (idx &gt;= 0) {
        state.selectedPlants.splice(idx, 1);
      } else {
        state.selectedPlants.push(id);
      }
      initPlantMenu();
      render();
    }

    function selectPreset(mode) {
      if (mode === &#x27;none&#x27;) state.selectedPlants = [];
      else if (mode === &#x27;herbs&#x27;) state.selectedPlants = [&#x27;marigold&#x27;, &#x27;basil&#x27;, &#x27;mint&#x27;, &#x27;lemongrass&#x27;];
      else if (mode === &#x27;soil&#x27;) state.selectedPlants = [&#x27;marigold&#x27;, &#x27;legume&#x27;, &#x27;gotukola&#x27;];
      else if (mode === &#x27;all&#x27;) state.selectedPlants = PLANT_CATALOG.map(p =&gt; p.id);
      initPlantMenu();
      render();
    }

    function setCrop(crop) {
      state.crop = crop;
      render();
    }

    function setSystem(sys) {
      state.system = sys;
      [&#x27;drip&#x27;, &#x27;360&#x27;, &#x27;180&#x27;].forEach(s =&gt; {
        const btn = document.getElementById(&#x27;sys-&#x27; + s);
        btn.classList.toggle(&#x27;active&#x27;, s === sys);
        btn.classList.toggle(&#x27;blue&#x27;, s === sys &amp;&amp; sys !== &#x27;drip&#x27;);
      });
      document.getElementById(&#x27;stage-group&#x27;).style.opacity = sys === &#x27;drip&#x27; ? &#x27;1&#x27; : &#x27;0.4&#x27;;
      document.getElementById(&#x27;stage-group&#x27;).style.pointerEvents = sys === &#x27;drip&#x27; ? &#x27;auto&#x27; : &#x27;none&#x27;;
      render();
    }

    function setTrees(count) {
      state.trees = count;
      document.getElementById(&#x27;tree-1&#x27;).classList.toggle(&#x27;active&#x27;, count === 1);
      document.getElementById(&#x27;tree-2&#x27;).classList.toggle(&#x27;active&#x27;, count === 2);
      initPlantMenu();
      render();
    }

    function setStage(stg) {
      state.stage = stg;
      document.getElementById(&#x27;stage-young&#x27;).classList.toggle(&#x27;active&#x27;, stg === &#x27;young&#x27;);
      document.getElementById(&#x27;stage-mature&#x27;).classList.toggle(&#x27;active&#x27;, stg === &#x27;mature&#x27;);
      render();
    }

    function drawCompanionPlants(treeCms, treeCy, pipeY) {
      const plants = PLANT_CATALOG.filter(plant =&gt; state.selectedPlants.includes(plant.id))
        .map(plant =&gt; ({ ...plant, count: plantCount(plant.id, defaultPlantCount(plant.id)) }));
      document.getElementById(&#x27;companion-legend&#x27;).innerHTML = plants.map(plant =&gt; `
        &lt;div class=&quot;legend-item&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:${plant.color};&quot;&gt;&lt;/span&gt;
          ${plant.name} · ${plant.count} ต้น
        &lt;/div&gt;
      `).join(&#x27;&#x27;);
      const total = plants.reduce((sum, plant) =&gt; sum + plant.count, 0);
      if (!total) return &#x27;&#x27;;

      const treeXs = treeCms.map(cm =&gt; BED_X + cm * SCALE);
      const equipment = treeXs.flatMap((x, index) =&gt; {
        if (state.system === &#x27;drip&#x27;) {
          const offsets = state.stage === &#x27;young&#x27;
            ? [[-18, 0], [18, 0]]
            : [[-32, 0], [32, 0], [0, -32], [0, 32]];
          return offsets.map(([dx, dy]) =&gt; [x + dx * SCALE, treeCy + dy * SCALE]);
        }
        if (state.system === &#x27;360&#x27;) {
          const offset = state.trees === 1 || index === 0 ? 18 : -18;
          const sprinklerX = x + offset * SCALE;
          return [[sprinklerX, treeCy], [sprinklerX, pipeY - 32]];
        }
        return [[x, BED_Y + 6]];
      });
      const margin = 16;
      const width = BED_W - margin * 2;
      const top = BED_Y + margin;
      const height = pipeY - margin - top;
      let pitch = Math.min(24, Math.sqrt(width * height / total));
      let positions;
      do {
        positions = [];
        for (let y = top; y &lt;= top + height; y += pitch) {
          for (let x = BED_X + margin; x &lt;= BED_X + margin + width; x += pitch) {
            const coversTree = treeXs.some(tx =&gt;
              (Math.abs(x - tx) &lt; 38 &amp;&amp; Math.abs(y - treeCy) &lt; 38) ||
              (Math.abs(x - tx) &lt; 78 &amp;&amp; Math.abs(y - (treeCy - 30)) &lt; 16)
            );
            const coversEquipment = equipment.some(([ex, ey]) =&gt;
              Math.abs(x - ex) &lt; 20 &amp;&amp; Math.abs(y - ey) &lt; 20
            );
            if (!coversTree &amp;&amp; !coversEquipment) positions.push({ x, y });
          }
        }
        if (positions.length &lt; total) pitch *= 0.85;
      } while (positions.length &lt; total);

      const radius = Math.min(10, pitch * 0.46);
      const markers = [];
      const spreadPoints = total &lt;= 200;
      const centerX = BED_X + BED_W / 2;
      const centerY = top + height / 2;
      // Start near the middle, then fill the largest gaps between planted points.
      const scores = spreadPoints
        ? positions.map(({ x, y }) =&gt; -((x - centerX) ** 2 + (y - centerY) ** 2))
        : [];
      const maxCount = Math.max(...plants.map(plant =&gt; plant.count));
      for (let index = 0; index &lt; maxCount; index++) {
        for (const plant of plants) {
          if (index &gt;= plant.count) continue;
          let slot = Math.floor((markers.length + 0.5) * positions.length / total);
          if (spreadPoints) {
            slot = scores.reduce((best, score, candidate) =&gt;
              score &gt; scores[best] ? candidate : best, 0
            );
          }
          const { x, y } = positions[slot];
          if (spreadPoints) {
            positions.forEach((point, candidate) =&gt; {
              const distance = (point.x - x) ** 2 + (point.y - y) ** 2;
              scores[candidate] = markers.length === 0 ? distance : Math.min(scores[candidate], distance);
            });
            scores[slot] = -Infinity;
          }

          markers.push(`&lt;circle data-plant=&quot;${plant.id}&quot; cx=&quot;${x.toFixed(2)}&quot;
            cy=&quot;${y.toFixed(2)}&quot; r=&quot;${radius}&quot; fill=&quot;${plant.color}&quot;
            stroke=&quot;#fff&quot; stroke-width=&quot;${Math.min(1.5, radius * 0.35)}&quot;&gt;${total &lt;= 80 ? `&lt;title&gt;${plant.name} ต้นที่ ${index + 1}&lt;/title&gt;` : &#x27;&#x27;}&lt;/circle&gt;`);
        }
      }
      return `&lt;g aria-label=&quot;พืชแซม ${total} ต้น&quot;&gt;${markers.join(&#x27;&#x27;)}&lt;/g&gt;`;
    }

    function render() {
      const crop = CROPS[state.crop];
      document.getElementById(&#x27;crop-legend&#x27;).textContent = crop.label;
      const irrigation = { drip: &#x27;น้ำหยด&#x27;, &#x27;360&#x27;: &#x27;มินิสปริงเกอร์ 360°&#x27;, &#x27;180&#x27;: &#x27;มินิสปริงเกอร์ 180°&#x27; };
      document.getElementById(&#x27;report-summary&#x27;).textContent =
        `${crop.label} ${state.trees} ต้น · แปลง 1.0 × 2.3 เมตร · ${irrigation[state.system]}`;
      const svg = document.getElementById(&#x27;blueprint&#x27;);
      let html = `
        &lt;defs&gt;
          &lt;pattern id=&quot;grid&quot; width=&quot;30&quot; height=&quot;30&quot; patternUnits=&quot;userSpaceOnUse&quot;&gt;
            &lt;path d=&quot;M 30 0 L 0 0 0 30&quot; fill=&quot;none&quot; stroke=&quot;rgba(255,255,255,0.08)&quot; stroke-width=&quot;1&quot;/&gt;
          &lt;/pattern&gt;
        &lt;/defs&gt;
        &lt;rect x=&quot;${BED_X - 8}&quot; y=&quot;${BED_Y - 8}&quot; width=&quot;${BED_W + 16}&quot; height=&quot;${BED_H + 16}&quot; rx=&quot;6&quot; fill=&quot;#94a3b8&quot; /&gt;
        &lt;rect x=&quot;${BED_X}&quot; y=&quot;${BED_Y}&quot; width=&quot;${BED_W}&quot; height=&quot;${BED_H}&quot; fill=&quot;#7c583a&quot; /&gt;
        &lt;rect x=&quot;${BED_X}&quot; y=&quot;${BED_Y}&quot; width=&quot;${BED_W}&quot; height=&quot;${BED_H}&quot; fill=&quot;url(#grid)&quot; /&gt;
      `;

      // Dimension Labels
      html += `
        &lt;line x1=&quot;${BED_X}&quot; y1=&quot;${BED_Y - 25}&quot; x2=&quot;${BED_X + BED_W}&quot; y2=&quot;${BED_Y - 25}&quot; stroke=&quot;#334155&quot; stroke-width=&quot;1.5&quot; /&gt;
        &lt;line x1=&quot;${BED_X}&quot; y1=&quot;${BED_Y - 32}&quot; x2=&quot;${BED_X}&quot; y2=&quot;${BED_Y - 18}&quot; stroke=&quot;#334155&quot; stroke-width=&quot;1.5&quot; /&gt;
        &lt;line x1=&quot;${BED_X + BED_W}&quot; y1=&quot;${BED_Y - 32}&quot; x2=&quot;${BED_X + BED_W}&quot; y2=&quot;${BED_Y - 18}&quot; stroke=&quot;#334155&quot; stroke-width=&quot;1.5&quot; /&gt;
        &lt;text x=&quot;${BED_X + BED_W / 2}&quot; y=&quot;${BED_Y - 31}&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;bold&quot; fill=&quot;#1e293b&quot;&gt;ความยาวแปลง 230 ซม. (2.3 เมตร)&lt;/text&gt;

        &lt;line x1=&quot;${BED_X - 25}&quot; y1=&quot;${BED_Y}&quot; x2=&quot;${BED_X - 25}&quot; y2=&quot;${BED_Y + BED_H}&quot; stroke=&quot;#334155&quot; stroke-width=&quot;1.5&quot; /&gt;
        &lt;line x1=&quot;${BED_X - 32}&quot; y1=&quot;${BED_Y}&quot; x2=&quot;${BED_X - 18}&quot; y2=&quot;${BED_Y}&quot; stroke=&quot;#334155&quot; stroke-width=&quot;1.5&quot; /&gt;
        &lt;line x1=&quot;${BED_X - 32}&quot; y1=&quot;${BED_Y + BED_H}&quot; x2=&quot;${BED_X - 18}&quot; y2=&quot;${BED_Y + BED_H}&quot; stroke=&quot;#334155&quot; stroke-width=&quot;1.5&quot; /&gt;
        &lt;text x=&quot;${BED_X - 36}&quot; y=&quot;${BED_Y + BED_H / 2}&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;bold&quot; fill=&quot;#1e293b&quot; transform=&quot;rotate(-90 ${BED_X - 36} ${BED_Y + BED_H / 2})&quot;&gt;กว้าง 100 ซม. (1 ม.)&lt;/text&gt;
      `;

      const treeCms = state.trees === 1 ? [115] : [57.5, 172.5];
      const treeCy = BED_Y + BED_H / 2;

      // Water Coverage Zones
      if (state.system === &#x27;drip&#x27;) {
        treeCms.forEach(tCm =&gt; {
          const tx = BED_X + tCm * SCALE;
          const offsets = state.stage === &#x27;young&#x27;
            ? [[-18, 0], [18, 0]]
            : [[-32, 0], [32, 0], [0, -32], [0, 32]];
          offsets.forEach(([dx, dy]) =&gt; {
            html += `&lt;circle cx=&quot;${tx + dx * SCALE}&quot; cy=&quot;${treeCy + dy * SCALE}&quot; r=&quot;${14 * SCALE}&quot; fill=&quot;rgba(56, 189, 248, 0.35)&quot; stroke=&quot;#38bdf8&quot; stroke-dasharray=&quot;3,3&quot; stroke-width=&quot;1.5&quot; /&gt;`;
          });
        });
      } else if (state.system === &#x27;360&#x27;) {
        treeCms.forEach((tCm, idx) =&gt; {
          const offsetCm = state.trees === 1 ? 18 : (idx === 0 ? 18 : -18);
          const sx = BED_X + (tCm + offsetCm) * SCALE;
          const radiusCm = state.trees === 1 ? 48 : 42;
          html += `&lt;circle cx=&quot;${sx}&quot; cy=&quot;${treeCy}&quot; r=&quot;${radiusCm * SCALE}&quot; fill=&quot;rgba(56, 189, 248, 0.32)&quot; stroke=&quot;#0284c7&quot; stroke-dasharray=&quot;5,4&quot; stroke-width=&quot;2&quot; /&gt;`;
        });
      } else if (state.system === &#x27;180&#x27;) {
        if (state.trees === 1) {
          const tx = BED_X + 115 * SCALE;
          const rPx = 65 * SCALE;
          html += `&lt;path d=&quot;M ${tx - rPx} ${BED_Y + 6} A ${rPx} ${rPx} 0 0 0 ${tx + rPx} ${BED_Y + 6} Z&quot; fill=&quot;rgba(56, 189, 248, 0.3)&quot; stroke=&quot;#0284c7&quot; stroke-dasharray=&quot;5,4&quot; stroke-width=&quot;2&quot; /&gt;`;
          html += `&lt;path d=&quot;M ${tx - rPx} ${BED_Y + BED_H - 6} A ${rPx} ${rPx} 0 0 1 ${tx + rPx} ${BED_Y + BED_H - 6} Z&quot; fill=&quot;rgba(56, 189, 248, 0.3)&quot; stroke=&quot;#0284c7&quot; stroke-dasharray=&quot;5,4&quot; stroke-width=&quot;2&quot; /&gt;`;
        } else {
          treeCms.forEach(tCm =&gt; {
            const tx = BED_X + tCm * SCALE;
            const rPx = 60 * SCALE;
            html += `&lt;path d=&quot;M ${tx - rPx} ${BED_Y + 6} A ${rPx} ${rPx} 0 0 0 ${tx + rPx} ${BED_Y + 6} Z&quot; fill=&quot;rgba(56, 189, 248, 0.32)&quot; stroke=&quot;#0284c7&quot; stroke-dasharray=&quot;5,4&quot; stroke-width=&quot;2&quot; /&gt;`;
          });
        }
      }

      const pipeY = BED_Y + BED_H - 22;

      // Main PE Pipe
      html += `
        &lt;line x1=&quot;${BED_X - 20}&quot; y1=&quot;${pipeY}&quot; x2=&quot;${BED_X + BED_W - 15}&quot; y2=&quot;${pipeY}&quot; stroke=&quot;#0f172a&quot; stroke-width=&quot;7&quot; stroke-linecap=&quot;round&quot; /&gt;
        &lt;text x=&quot;${BED_X + 10}&quot; y=&quot;${pipeY + 16}&quot; font-size=&quot;11&quot; fill=&quot;#f8fafc&quot; font-weight=&quot;bold&quot;&gt;ท่อ PE 16/20 มม.&lt;/text&gt;
      `;

      // Emitters / Sprinklers
      if (state.system === &#x27;drip&#x27;) {
        treeCms.forEach(tCm =&gt; {
          const tx = BED_X + tCm * SCALE;
          const offsets = state.stage === &#x27;young&#x27;
            ? [[-18, 0], [18, 0]]
            : [[-32, 0], [32, 0], [0, -32], [0, 32]];
          offsets.forEach(([dx, dy]) =&gt; {
            const ex = tx + dx * SCALE;
            const ey = treeCy + dy * SCALE;
            html += `
              &lt;path d=&quot;M ${ex} ${pipeY} L ${ex} ${ey}&quot; stroke=&quot;#334155&quot; stroke-width=&quot;2&quot; fill=&quot;none&quot; /&gt;
              &lt;circle cx=&quot;${ex}&quot; cy=&quot;${ey}&quot; r=&quot;6&quot; fill=&quot;#0284c7&quot; stroke=&quot;#fff&quot; stroke-width=&quot;1.5&quot; /&gt;
            `;
          });
        });
      } else if (state.system === &#x27;360&#x27;) {
        treeCms.forEach((tCm, idx) =&gt; {
          const offsetCm = state.trees === 1 ? 18 : (idx === 0 ? 18 : -18);
          const sx = BED_X + (tCm + offsetCm) * SCALE;
          const valveY = pipeY - 32;
          html += `
            &lt;line x1=&quot;${sx}&quot; y1=&quot;${pipeY}&quot; x2=&quot;${sx}&quot; y2=&quot;${treeCy}&quot; stroke=&quot;#334155&quot; stroke-width=&quot;2.5&quot; /&gt;
            &lt;rect x=&quot;${sx - 6}&quot; y=&quot;${valveY - 8}&quot; width=&quot;12&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;#ef4444&quot; stroke=&quot;#fff&quot; stroke-width=&quot;1&quot; /&gt;
            &lt;circle cx=&quot;${sx}&quot; cy=&quot;${treeCy}&quot; r=&quot;8&quot; fill=&quot;#0284c7&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2&quot; /&gt;
            &lt;circle cx=&quot;${sx}&quot; cy=&quot;${treeCy}&quot; r=&quot;3&quot; fill=&quot;#fff&quot; /&gt;
          `;
        });
      } else if (state.system === &#x27;180&#x27;) {
        if (state.trees === 1) {
          const tx = BED_X + 115 * SCALE;
          html += `
            &lt;line x1=&quot;${tx}&quot; y1=&quot;${pipeY}&quot; x2=&quot;${tx}&quot; y2=&quot;${BED_Y + BED_H - 6}&quot; stroke=&quot;#334155&quot; stroke-width=&quot;2.5&quot; /&gt;
            &lt;path d=&quot;M ${tx - 9} ${BED_Y + BED_H - 6} A 9 9 0 0 1 ${tx + 9} ${BED_Y + BED_H - 6} Z&quot; fill=&quot;#0284c7&quot; stroke=&quot;#fff&quot; stroke-width=&quot;1.5&quot; /&gt;
            &lt;path d=&quot;M ${tx - 45} ${pipeY} L ${tx - 45} ${BED_Y + 6} L ${tx} ${BED_Y + 6}&quot; stroke=&quot;#334155&quot; stroke-width=&quot;2&quot; fill=&quot;none&quot; /&gt;
            &lt;path d=&quot;M ${tx - 9} ${BED_Y + 6} A 9 9 0 0 0 ${tx + 9} ${BED_Y + 6} Z&quot; fill=&quot;#0284c7&quot; stroke=&quot;#fff&quot; stroke-width=&quot;1.5&quot; /&gt;
          `;
        } else {
          treeCms.forEach(tCm =&gt; {
            const tx = BED_X + tCm * SCALE;
            html += `
              &lt;path d=&quot;M ${tx - 35} ${pipeY} L ${tx - 35} ${BED_Y + 6} L ${tx} ${BED_Y + 6}&quot; stroke=&quot;#334155&quot; stroke-width=&quot;2&quot; fill=&quot;none&quot; /&gt;
              &lt;path d=&quot;M ${tx - 9} ${BED_Y + 6} A 9 9 0 0 0 ${tx + 9} ${BED_Y + 6} Z&quot; fill=&quot;#0284c7&quot; stroke=&quot;#fff&quot; stroke-width=&quot;1.5&quot; /&gt;
            `;
          });
        }
      }

      html += drawCompanionPlants(treeCms, treeCy, pipeY);

      // Render Lemon Trees on top
      treeCms.forEach((tCm, i) =&gt; {
        const tx = BED_X + tCm * SCALE;
        html += `
          &lt;circle cx=&quot;${tx}&quot; cy=&quot;${treeCy}&quot; r=&quot;24&quot; fill=&quot;rgba(22, 163, 74, 0.35)&quot; stroke=&quot;#22c55e&quot; stroke-width=&quot;1.5&quot; /&gt;
          &lt;circle cx=&quot;${tx}&quot; cy=&quot;${treeCy}&quot; r=&quot;12&quot; fill=&quot;#16a34a&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2&quot; /&gt;
          &lt;text x=&quot;${tx}&quot; y=&quot;${treeCy - 30}&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;bold&quot; fill=&quot;#ffffff&quot; style=&quot;text-shadow: 0 1px 3px #000;&quot;&gt;${crop.mapName} #${i + 1} (${tCm} ซม.)&lt;/text&gt;
        `;
      });

      // Bottom Spacing Markers
      if (state.trees === 1) {
        const midX = BED_X + 115 * SCALE;
        html += `
          &lt;line x1=&quot;${BED_X}&quot; y1=&quot;${BED_Y + BED_H + 22}&quot; x2=&quot;${midX}&quot; y2=&quot;${BED_Y + BED_H + 22}&quot; stroke=&quot;#475569&quot; stroke-width=&quot;1.5&quot; /&gt;
          &lt;text x=&quot;${(BED_X + midX)/2}&quot; y=&quot;${BED_Y + BED_H + 38}&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;#334155&quot;&gt;115 ซม.&lt;/text&gt;
          &lt;line x1=&quot;${midX}&quot; y1=&quot;${BED_Y + BED_H + 22}&quot; x2=&quot;${BED_X + BED_W}&quot; y2=&quot;${BED_Y + BED_H + 22}&quot; stroke=&quot;#475569&quot; stroke-width=&quot;1.5&quot; /&gt;
          &lt;text x=&quot;${(midX + BED_X + BED_W)/2}&quot; y=&quot;${BED_Y + BED_H + 38}&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;#334155&quot;&gt;115 ซม.&lt;/text&gt;
        `;
      } else {
        const t1X = BED_X + 57.5 * SCALE;
        const t2X = BED_X + 172.5 * SCALE;
        html += `
          &lt;line x1=&quot;${BED_X}&quot; y1=&quot;${BED_Y + BED_H + 22}&quot; x2=&quot;${t1X}&quot; y2=&quot;${BED_Y + BED_H + 22}&quot; stroke=&quot;#475569&quot; stroke-width=&quot;1.5&quot; /&gt;
          &lt;text x=&quot;${(BED_X + t1X)/2}&quot; y=&quot;${BED_Y + BED_H + 38}&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;#334155&quot;&gt;57.5 ซม.&lt;/text&gt;
          &lt;line x1=&quot;${t1X}&quot; y1=&quot;${BED_Y + BED_H + 22}&quot; x2=&quot;${t2X}&quot; y2=&quot;${BED_Y + BED_H + 22}&quot; stroke=&quot;#475569&quot; stroke-width=&quot;1.5&quot; /&gt;
          &lt;text x=&quot;${(t1X + t2X)/2}&quot; y=&quot;${BED_Y + BED_H + 38}&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;#334155&quot;&gt;ระยะห่าง 115 ซม.&lt;/text&gt;
          &lt;line x1=&quot;${t2X}&quot; y1=&quot;${BED_Y + BED_H + 22}&quot; x2=&quot;${BED_X + BED_W}&quot; y2=&quot;${BED_Y + BED_H + 22}&quot; stroke=&quot;#475569&quot; stroke-width=&quot;1.5&quot; /&gt;
          &lt;text x=&quot;${(t2X + BED_X + BED_W)/2}&quot; y=&quot;${BED_Y + BED_H + 38}&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;#334155&quot;&gt;57.5 ซม.&lt;/text&gt;
        `;
      }

      svg.innerHTML = html;
      updateSpecs();
    }

    function updateSpecs() {
      const crop = CROPS[state.crop];
      const card = document.getElementById(&#x27;specs&#x27;);
      card.className = &#x27;specs-card&#x27; + (state.system !== &#x27;drip&#x27; ? &#x27; blue-theme&#x27; : &#x27;&#x27;);

      if (state.system === &#x27;drip&#x27;) {
        const totalHeads = state.trees * (state.stage === &#x27;young&#x27; ? 2 : 4);
        const dist = state.stage === &#x27;young&#x27; ? &#x27;15–20 ซม.&#x27; : &#x27;30–40 ซม.&#x27;;
        card.innerHTML = `
          &lt;h3&gt;ระบบน้ำหยด (${state.trees} ต้น / ${state.stage === &#x27;young&#x27; ? &#x27;ปลูกใหม่&#x27; : &#x27;ต้นโต&#x27;})&lt;/h3&gt;
          &lt;ul&gt;
            &lt;li&gt;&lt;strong&gt;จำนวนหัว:&lt;/strong&gt; &lt;strong&gt;${totalHeads} หัว&lt;/strong&gt; (รุ่นชดเชยแรงดัน 2 ลิตร/ชม.)&lt;/li&gt;
            &lt;li&gt;&lt;strong&gt;ระยะปัก:&lt;/strong&gt; ห่างโคน${crop.mapName} &lt;strong&gt;${dist}&lt;/strong&gt;&lt;/li&gt;
            &lt;li&gt;&lt;strong&gt;จุดเด่น:&lt;/strong&gt; คุมความชื้นแม่นยำ ใบ${crop.mapName}ไม่เปียก ลดโรคแคงเกอร์&lt;/li&gt;
          &lt;/ul&gt;
        `;
      } else if (state.system === &#x27;360&#x27;) {
        const diam = state.trees === 1 ? &#x27;90–100 ซม.&#x27; : &#x27;80–85 ซม.&#x27;;
        card.innerHTML = `
          &lt;h3&gt;มินิสปริงเกอร์ 360° (${state.trees} ต้น)&lt;/h3&gt;
          &lt;ul&gt;
            &lt;li&gt;&lt;strong&gt;จำนวนหัว:&lt;/strong&gt; &lt;strong&gt;${state.trees} หัว&lt;/strong&gt; ปักเยื้องโคนต้น 15–20 ซม. (ก้านเตี้ย 10–15 ซม.)&lt;/li&gt;
            &lt;li&gt;&lt;strong&gt;การคุมรัศมี:&lt;/strong&gt; ติด &lt;strong&gt;มินิวาล์วหรี่น้ำ&lt;/strong&gt; คุมวงน้ำไม่เกิน &lt;strong&gt;${diam}&lt;/strong&gt;&lt;/li&gt;
            &lt;li&gt;&lt;strong&gt;ข้อดีเมื่อปลูกพืชแซม:&lt;/strong&gt; ช่วยเพิ่มความชื้นให้สะระแหน่และผักใบเขียวรอบแปลงได้ดี&lt;/li&gt;
          &lt;/ul&gt;
        `;
      } else {
        card.innerHTML = `
          &lt;h3&gt;มินิสปริงเกอร์ 180° (${state.trees} ต้น)&lt;/h3&gt;
          &lt;ul&gt;
            &lt;li&gt;&lt;strong&gt;จำนวนหัว:&lt;/strong&gt; &lt;strong&gt;2 หัว&lt;/strong&gt; ปักขอบแปลงหันเข้าหากลางแปลง&lt;/li&gt;
            &lt;li&gt;&lt;strong&gt;การตั้งค่า:&lt;/strong&gt; หรี่รัศมีไม่เกิน 60–65 ซม. ไม่ให้น้ำล้นขอบแปลง 1 เมตร&lt;/li&gt;
          &lt;/ul&gt;
        `;
      }

      const compCard = document.getElementById(&#x27;companion-specs&#x27;);
      if (state.selectedPlants.length === 0) {
        compCard.innerHTML = `
          &lt;h3&gt;ปลูก${crop.name}ล้วน (ไม่ปลูกพืชแซม)&lt;/h3&gt;
          &lt;ul&gt;
            &lt;li&gt;&lt;strong&gt;ข้อดี:&lt;/strong&gt; โล่ง โปร่ง อากาศถ่ายเทดี ดูแลทรงพุ่มและใส่ปุ๋ยโคนต้นได้สะดวกที่สุด&lt;/li&gt;
            &lt;li&gt;&lt;strong&gt;คำแนะนำ:&lt;/strong&gt; สามารถใช้ฟางข้าวหรือใบไม้แห้งคลุมโคนต้นบางๆ แทนได้&lt;/li&gt;
          &lt;/ul&gt;
        `;
      } else {
        const totalPlants = state.selectedPlants.reduce(
          (total, id) =&gt; total + plantCount(id, defaultPlantCount(id)), 0
        );
        const itemsHtml = state.selectedPlants.map(id =&gt; {
          const p = PLANT_CATALOG.find(item =&gt; item.id === id);
          return `&lt;li&gt;&lt;strong&gt;${p.name} (${plantCount(id, defaultPlantCount(id))} ต้น)&lt;/strong&gt; — ${p.role}&lt;/li&gt;`;
        }).join(&#x27;&#x27;);
        compCard.innerHTML = `
          &lt;h3&gt;พืชแซมที่เลือกไว้ (${state.selectedPlants.length} ชนิด รวม ${totalPlants} ต้น)&lt;/h3&gt;
          &lt;ul&gt;
            ${itemsHtml}
            &lt;li&gt;&lt;strong&gt;ข้อห้าม:&lt;/strong&gt; ห้ามปลูก &lt;em&gt;พริก มะเขือ&lt;/em&gt; และ &lt;em&gt;พืชหัว/ไม้เลื้อย&lt;/em&gt;&lt;/li&gt;
          &lt;/ul&gt;
        `;
      }
    }

    initPlantMenu();
    render();
    document.getElementById(&#x27;export-pdf&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; window.print());
  &lt;/script&gt;

        name: &#x27;ดาวเรือง&#x27;,
        color: &#x27;#f59e0b&#x27;,
        role: &#x27;ลดไส้เดือนฝอยในดิน และล่อแมลงตัวห้ำช่วยคุมเพลี้ย&#x27;
      },
      {
        id: &#x27;basil&#x27;,
        name: &#x27;โหระพา&#x27;,
        color: &#x27;#10b981&#x27;,
        role: &#x27;ปลูกในจุดที่ได้รับแสงและเว้นช่องให้เก็บยอดได้สะดวก&#x27;
      },
      {
        id: &#x27;chili&#x27;,
        name: &#x27;พริกขี้หนูสวน&#x27;,
        color: &#x27;#ef4444&#x27;,
        role: &#x27;วางในจุดที่ได้รับแสงและเว้นช่องให้เก็บผลได้สะดวก&#x27;
      },
      {
        id: &#x27;papaya&#x27;,
        name: &#x27;มะละกอเตี้ย&#x27;,
        color: &#x27;#e87925&#x27;,
        role: &#x27;เว้นพื้นที่ให้ทรงพุ่ม และจัดไม่ให้บังแสงพืชขนาดเล็ก&#x27;
      },
      {
        id: &#x27;mint&#x27;,
        name: &#x27;สะระแหน่&#x27;,
        color: &#x27;#34d399&#x27;,
        role: &#x27;คลุมผิวดินลดการระเหยของน้ำ รากตื้นไม่รบกวนรากของต้นหลัก&#x27;
      },
      {
        id: &#x27;veggies&#x27;,
        name: &#x27;ต้นหอม / ผักชี / สลัด&#x27;,
        color: &#x27;#84cc16&#x27;,
        role: &#x27;ผักอายุสั้น (30–45 วัน) เก็บไว ไม่แย่งปุ๋ยระยะยาว&#x27;
      },
      {
        id: &#x27;lemongrass&#x27;,
        name: &#x27;ตะไคร้&#x27;,
        color: &#x27;#0d9488&#x27;,
        role: &#x27;จัดไว้ด้านหัวหรือท้ายแปลงและแบ่งกอเมื่อเริ่มเบียดพืชข้างเคียง&#x27;
      },
      {
        id: &#x27;legume&#x27;,
        name: &#x27;ถั่วพุ่มเตี้ย / ถั่วเขียว&#x27;,
        color: &#x27;#a3e635&#x27;,
        role: &#x27;พืชตระกูลถั่วช่วยตรึงไนโตรเจนบำรุงดิน ตัดสับคลุมโคนได้&#x27;
      },
      {
        id: &#x27;gotukola&#x27;,
        name: &#x27;ผักโขม / บัวบก&#x27;,
        color: &#x27;#65a30d&#x27;,
        role: &#x27;คลุมดินบริเวณขอบหรือพื้นที่ว่าง รากตื้น เก็บเกี่ยวใช้ประโยชน์ได้&#x27;
      }
    ];

    const CROPS = Object.fromEntries(
      PLANT_CATALOG.filter(({ id }) =&gt; [&#x27;papaya&#x27;, &#x27;basil&#x27;, &#x27;chili&#x27;, &#x27;lemongrass&#x27;].includes(id))
        .map(({ id, name }) =&gt; [id, { name, label: name, mapName: name }])
    );
    const MIXED_BED = [&#x27;papaya&#x27;, &#x27;basil&#x27;, &#x27;chili&#x27;, &#x27;lemongrass&#x27;];

    const state = {
      crop: &#x27;papaya&#x27;,
      system: &#x27;drip&#x27;,
      trees: 1,
      stage: &#x27;young&#x27;,
      selectedPlants: MIXED_BED.filter(id =&gt; id !== &#x27;papaya&#x27;),
      plantCounts: {}
    };

    const SCALE = 3;
    const BED_X = 80;
    const BED_Y = 60;
    const BED_W = 230 * SCALE;
    const BED_H = 100 * SCALE;

    function plantCount(id, defaultCount) {
      return state.plantCounts[id] ?? defaultCount;
    }

    function defaultPlantCount(id) {
      if ([&#x27;papaya&#x27;, &#x27;chili&#x27;, &#x27;lemongrass&#x27;].includes(id)) return 1;
      if (id === &#x27;marigold&#x27;) return 4;
      if (state.trees === 2 &amp;&amp; [&#x27;basil&#x27;, &#x27;mint&#x27;].includes(id)) return 1;
      return 2;
    }

    function setPlantCount(input, id) {
      if (input.validity.valid) {
        state.plantCounts[id] = input.valueAsNumber;
        render();
      }
    }

    function initPlantMenu() {
      const container = document.getElementById(&#x27;plant-chips&#x27;);
      container.innerHTML = PLANT_CATALOG.filter(p =&gt; p.id !== state.crop).map(p =&gt; {
        const isSel = state.selectedPlants.includes(p.id);
        return `
          &lt;div class=&quot;plant-option&quot;&gt;
          &lt;button aria-pressed=&quot;${isSel}&quot; type=&quot;button&quot; id=&quot;chip-${p.id}&quot; class=&quot;plant-chip ${isSel ? &#x27;selected&#x27; : &#x27;&#x27;}&quot; onclick=&quot;togglePlant(&#x27;${p.id}&#x27;)&quot;&gt;
            &lt;span class=&quot;chip-dot&quot; style=&quot;background:${p.color};&quot;&gt;&lt;/span&gt;
            &lt;span&gt;${isSel ? &#x27;✓ &#x27; : &#x27;+ &#x27;}${p.name}&lt;/span&gt;
          &lt;/button&gt;
          ${isSel ? `
            &lt;label class=&quot;plant-count&quot;&gt;
              &lt;input type=&quot;number&quot; min=&quot;1&quot; max=&quot;9999&quot; step=&quot;1&quot; required
                aria-label=&quot;จำนวนต้น ${p.name}&quot; value=&quot;${plantCount(p.id, defaultPlantCount(p.id))}&quot;
                oninput=&quot;setPlantCount(this, &#x27;${p.id}&#x27;)&quot;
                onblur=&quot;if (!this.validity.valid) this.value = plantCount(&#x27;${p.id}&#x27;, defaultPlantCount(&#x27;${p.id}&#x27;))&quot;&gt;
              ต้น
            &lt;/label&gt;
          ` : &#x27;&#x27;}
          &lt;/div&gt;
        `;
      }).join(&#x27;&#x27;);
    }

    function togglePlant(id) {
      const idx = state.selectedPlants.indexOf(id);
      if (idx &gt;= 0) {
        state.selectedPlants.splice(idx, 1);
      } else {
        state.selectedPlants.push(id);
      }
      initPlantMenu();
      render();
    }

    function selectPreset(mode) {
      if (mode === &#x27;mixed&#x27;) state.selectedPlants = MIXED_BED;
      else if (mode === &#x27;none&#x27;) state.selectedPlants = [];
      else if (mode === &#x27;herbs&#x27;) state.selectedPlants = [&#x27;basil&#x27;, &#x27;mint&#x27;, &#x27;lemongrass&#x27;];
      else if (mode === &#x27;soil&#x27;) state.selectedPlants = [&#x27;marigold&#x27;, &#x27;legume&#x27;, &#x27;gotukola&#x27;];
      else if (mode === &#x27;all&#x27;) state.selectedPlants = PLANT_CATALOG.map(p =&gt; p.id);
      state.selectedPlants = state.selectedPlants.filter(id =&gt; id !== state.crop);
      initPlantMenu();
      render();
    }

    function setCrop(crop) {
      const previousCrop = state.crop;
      state.crop = crop;
      if (state.selectedPlants.includes(crop)) {
        state.selectedPlants = state.selectedPlants.map(id =&gt; id === crop ? previousCrop : id);
      }
      initPlantMenu();
      render();
    }

    function setSystem(sys) {
      state.system = sys;
      [&#x27;drip&#x27;, &#x27;360&#x27;, &#x27;180&#x27;].forEach(s =&gt; {
        const btn = document.getElementById(&#x27;sys-&#x27; + s);
        btn.classList.toggle(&#x27;active&#x27;, s === sys);
        btn.classList.toggle(&#x27;blue&#x27;, s === sys &amp;&amp; sys !== &#x27;drip&#x27;);
      });
      document.getElementById(&#x27;stage-group&#x27;).style.opacity = sys === &#x27;drip&#x27; ? &#x27;1&#x27; : &#x27;0.4&#x27;;
      document.getElementById(&#x27;stage-group&#x27;).style.pointerEvents = sys === &#x27;drip&#x27; ? &#x27;auto&#x27; : &#x27;none&#x27;;
      render();
    }

    function setTrees(count) {
      state.trees = count;
      document.getElementById(&#x27;tree-1&#x27;).classList.toggle(&#x27;active&#x27;, count === 1);
      document.getElementById(&#x27;tree-2&#x27;).classList.toggle(&#x27;active&#x27;, count === 2);
      initPlantMenu();
      render();
    }

    function setStage(stg) {
      state.stage = stg;
      document.getElementById(&#x27;stage-young&#x27;).classList.toggle(&#x27;active&#x27;, stg === &#x27;young&#x27;);
      document.getElementById(&#x27;stage-mature&#x27;).classList.toggle(&#x27;active&#x27;, stg === &#x27;mature&#x27;);
      render();
    }

    function drawCompanionPlants(treeCms, treeCy, pipeY) {
      const plants = PLANT_CATALOG.filter(plant =&gt; state.selectedPlants.includes(plant.id))
        .map(plant =&gt; ({ ...plant, count: plantCount(plant.id, defaultPlantCount(plant.id)) }));
      document.getElementById(&#x27;companion-legend&#x27;).innerHTML = plants.map(plant =&gt; `
        &lt;div class=&quot;legend-item&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:${plant.color};&quot;&gt;&lt;/span&gt;
          ${plant.name} · ${plant.count} ต้น
        &lt;/div&gt;
      `).join(&#x27;&#x27;);
      const total = plants.reduce((sum, plant) =&gt; sum + plant.count, 0);
      if (!total) return &#x27;&#x27;;

      const treeXs = treeCms.map(cm =&gt; BED_X + cm * SCALE);
      const equipment = treeXs.flatMap((x, index) =&gt; {
        if (state.system === &#x27;drip&#x27;) {
          const offsets = state.stage === &#x27;young&#x27;
            ? [[-18, 0], [18, 0]]
            : [[-32, 0], [32, 0], [0, -32], [0, 32]];
          return offsets.map(([dx, dy]) =&gt; [x + dx * SCALE, treeCy + dy * SCALE]);
        }
        if (state.system === &#x27;360&#x27;) {
          const offset = state.trees === 1 || index === 0 ? 18 : -18;
          const sprinklerX = x + offset * SCALE;
          return [[sprinklerX, treeCy], [sprinklerX, pipeY - 32]];
        }
        return [[x, BED_Y + 6]];
      });
      const margin = 16;
      const width = BED_W - margin * 2;
      const top = BED_Y + margin;
      const height = pipeY - margin - top;
      let pitch = Math.min(24, Math.sqrt(width * height / total));
      let positions;
      do {
        positions = [];
        for (let y = top; y &lt;= top + height; y += pitch) {
          for (let x = BED_X + margin; x &lt;= BED_X + margin + width; x += pitch) {
            const coversTree = treeXs.some(tx =&gt;
              (Math.abs(x - tx) &lt; 38 &amp;&amp; Math.abs(y - treeCy) &lt; 38) ||
              (Math.abs(x - tx) &lt; 78 &amp;&amp; Math.abs(y - (treeCy - 30)) &lt; 16)
            );
            const coversEquipment = equipment.some(([ex, ey]) =&gt;
              Math.abs(x - ex) &lt; 20 &amp;&amp; Math.abs(y - ey) &lt; 20
            );
            if (!coversTree &amp;&amp; !coversEquipment) positions.push({ x, y });
          }
        }
        if (positions.length &lt; total) pitch *= 0.85;
      } while (positions.length &lt; total);

      const radius = Math.min(10, pitch * 0.46);
      const markers = [];
      const spreadPoints = total &lt;= 200;
      const centerX = BED_X + BED_W / 2;
      const centerY = top + height / 2;
      // Start near the middle, then fill the largest gaps between planted points.
      const scores = spreadPoints
        ? positions.map(({ x, y }) =&gt; -((x - centerX) ** 2 + (y - centerY) ** 2))
        : [];
      const maxCount = Math.max(...plants.map(plant =&gt; plant.count));
      for (let index = 0; index &lt; maxCount; index++) {
        for (const plant of plants) {
          if (index &gt;= plant.count) continue;
          let slot = Math.floor((markers.length + 0.5) * positions.length / total);
          if (spreadPoints) {
            slot = scores.reduce((best, score, candidate) =&gt;
              score &gt; scores[best] ? candidate : best, 0
            );
          }
          const { x, y } = positions[slot];
          if (spreadPoints) {
            positions.forEach((point, candidate) =&gt; {
              const distance = (point.x - x) ** 2 + (point.y - y) ** 2;
              scores[candidate] = markers.length === 0 ? distance : Math.min(scores[candidate], distance);
            });
            scores[slot] = -Infinity;
          }

          markers.push(`&lt;circle data-plant=&quot;${plant.id}&quot; cx=&quot;${x.toFixed(2)}&quot;
            cy=&quot;${y.toFixed(2)}&quot; r=&quot;${radius}&quot; fill=&quot;${plant.color}&quot;
            stroke=&quot;#fff&quot; stroke-width=&quot;${Math.min(1.5, radius * 0.35)}&quot;&gt;${total &lt;= 80 ? `&lt;title&gt;${plant.name} ต้นที่ ${index + 1}&lt;/title&gt;` : &#x27;&#x27;}&lt;/circle&gt;`);
        }
      }
      return `&lt;g aria-label=&quot;พืชแซม ${total} ต้น&quot;&gt;${markers.join(&#x27;&#x27;)}&lt;/g&gt;`;
    }

    function render() {
      const crop = CROPS[state.crop];
      document.getElementById(&#x27;crop-legend&#x27;).textContent = crop.label;
      const irrigation = { drip: &#x27;น้ำหยด&#x27;, &#x27;360&#x27;: &#x27;มินิสปริงเกอร์ 360°&#x27;, &#x27;180&#x27;: &#x27;มินิสปริงเกอร์ 180°&#x27; };
      document.getElementById(&#x27;report-summary&#x27;).textContent =
        `${crop.label} ${state.trees} ต้น · แปลง 1.0 × 2.3 เมตร · ${irrigation[state.system]}`;
      const svg = document.getElementById(&#x27;blueprint&#x27;);
      let html = `
        &lt;defs&gt;
          &lt;pattern id=&quot;grid&quot; width=&quot;30&quot; height=&quot;30&quot; patternUnits=&quot;userSpaceOnUse&quot;&gt;
            &lt;path d=&quot;M 30 0 L 0 0 0 30&quot; fill=&quot;none&quot; stroke=&quot;rgba(255,255,255,0.08)&quot; stroke-width=&quot;1&quot;/&gt;
          &lt;/pattern&gt;
        &lt;/defs&gt;
        &lt;rect x=&quot;${BED_X - 8}&quot; y=&quot;${BED_Y - 8}&quot; width=&quot;${BED_W + 16}&quot; height=&quot;${BED_H + 16}&quot; rx=&quot;6&quot; fill=&quot;#94a3b8&quot; /&gt;
        &lt;rect x=&quot;${BED_X}&quot; y=&quot;${BED_Y}&quot; width=&quot;${BED_W}&quot; height=&quot;${BED_H}&quot; fill=&quot;#7c583a&quot; /&gt;
        &lt;rect x=&quot;${BED_X}&quot; y=&quot;${BED_Y}&quot; width=&quot;${BED_W}&quot; height=&quot;${BED_H}&quot; fill=&quot;url(#grid)&quot; /&gt;
      `;

      // Dimension Labels
      html += `
        &lt;line x1=&quot;${BED_X}&quot; y1=&quot;${BED_Y - 25}&quot; x2=&quot;${BED_X + BED_W}&quot; y2=&quot;${BED_Y - 25}&quot; stroke=&quot;#334155&quot; stroke-width=&quot;1.5&quot; /&gt;
        &lt;line x1=&quot;${BED_X}&quot; y1=&quot;${BED_Y - 32}&quot; x2=&quot;${BED_X}&quot; y2=&quot;${BED_Y - 18}&quot; stroke=&quot;#334155&quot; stroke-width=&quot;1.5&quot; /&gt;
        &lt;line x1=&quot;${BED_X + BED_W}&quot; y1=&quot;${BED_Y - 32}&quot; x2=&quot;${BED_X + BED_W}&quot; y2=&quot;${BED_Y - 18}&quot; stroke=&quot;#334155&quot; stroke-width=&quot;1.5&quot; /&gt;
        &lt;text x=&quot;${BED_X + BED_W / 2}&quot; y=&quot;${BED_Y - 31}&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;bold&quot; fill=&quot;#1e293b&quot;&gt;ความยาวแปลง 230 ซม. (2.3 เมตร)&lt;/text&gt;

        &lt;line x1=&quot;${BED_X - 25}&quot; y1=&quot;${BED_Y}&quot; x2=&quot;${BED_X - 25}&quot; y2=&quot;${BED_Y + BED_H}&quot; stroke=&quot;#334155&quot; stroke-width=&quot;1.5&quot; /&gt;
        &lt;line x1=&quot;${BED_X - 32}&quot; y1=&quot;${BED_Y}&quot; x2=&quot;${BED_X - 18}&quot; y2=&quot;${BED_Y}&quot; stroke=&quot;#334155&quot; stroke-width=&quot;1.5&quot; /&gt;
        &lt;line x1=&quot;${BED_X - 32}&quot; y1=&quot;${BED_Y + BED_H}&quot; x2=&quot;${BED_X - 18}&quot; y2=&quot;${BED_Y + BED_H}&quot; stroke=&quot;#334155&quot; stroke-width=&quot;1.5&quot; /&gt;
        &lt;text x=&quot;${BED_X - 36}&quot; y=&quot;${BED_Y + BED_H / 2}&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;bold&quot; fill=&quot;#1e293b&quot; transform=&quot;rotate(-90 ${BED_X - 36} ${BED_Y + BED_H / 2})&quot;&gt;กว้าง 100 ซม. (1 ม.)&lt;/text&gt;
      `;

      const treeCms = state.trees === 1 ? [115] : [57.5, 172.5];
      const treeCy = BED_Y + BED_H / 2;

      // Water Coverage Zones
      if (state.system === &#x27;drip&#x27;) {
        treeCms.forEach(tCm =&gt; {
          const tx = BED_X + tCm * SCALE;
          const offsets = state.stage === &#x27;young&#x27;
            ? [[-18, 0], [18, 0]]
            : [[-32, 0], [32, 0], [0, -32], [0, 32]];
          offsets.forEach(([dx, dy]) =&gt; {
            html += `&lt;circle cx=&quot;${tx + dx * SCALE}&quot; cy=&quot;${treeCy + dy * SCALE}&quot; r=&quot;${14 * SCALE}&quot; fill=&quot;rgba(56, 189, 248, 0.35)&quot; stroke=&quot;#38bdf8&quot; stroke-dasharray=&quot;3,3&quot; stroke-width=&quot;1.5&quot; /&gt;`;
          });
        });
      } else if (state.system === &#x27;360&#x27;) {
        treeCms.forEach((tCm, idx) =&gt; {
          const offsetCm = state.trees === 1 ? 18 : (idx === 0 ? 18 : -18);
          const sx = BED_X + (tCm + offsetCm) * SCALE;
          const radiusCm = state.trees === 1 ? 48 : 42;
          html += `&lt;circle cx=&quot;${sx}&quot; cy=&quot;${treeCy}&quot; r=&quot;${radiusCm * SCALE}&quot; fill=&quot;rgba(56, 189, 248, 0.32)&quot; stroke=&quot;#0284c7&quot; stroke-dasharray=&quot;5,4&quot; stroke-width=&quot;2&quot; /&gt;`;
        });
      } else if (state.system === &#x27;180&#x27;) {
        if (state.trees === 1) {
          const tx = BED_X + 115 * SCALE;
          const rPx = 65 * SCALE;
          html += `&lt;path d=&quot;M ${tx - rPx} ${BED_Y + 6} A ${rPx} ${rPx} 0 0 0 ${tx + rPx} ${BED_Y + 6} Z&quot; fill=&quot;rgba(56, 189, 248, 0.3)&quot; stroke=&quot;#0284c7&quot; stroke-dasharray=&quot;5,4&quot; stroke-width=&quot;2&quot; /&gt;`;
          html += `&lt;path d=&quot;M ${tx - rPx} ${BED_Y + BED_H - 6} A ${rPx} ${rPx} 0 0 1 ${tx + rPx} ${BED_Y + BED_H - 6} Z&quot; fill=&quot;rgba(56, 189, 248, 0.3)&quot; stroke=&quot;#0284c7&quot; stroke-dasharray=&quot;5,4&quot; stroke-width=&quot;2&quot; /&gt;`;
        } else {
          treeCms.forEach(tCm =&gt; {
            const tx = BED_X + tCm * SCALE;
            const rPx = 60 * SCALE;
            html += `&lt;path d=&quot;M ${tx - rPx} ${BED_Y + 6} A ${rPx} ${rPx} 0 0 0 ${tx + rPx} ${BED_Y + 6} Z&quot; fill=&quot;rgba(56, 189, 248, 0.32)&quot; stroke=&quot;#0284c7&quot; stroke-dasharray=&quot;5,4&quot; stroke-width=&quot;2&quot; /&gt;`;
          });
        }
      }

      const pipeY = BED_Y + BED_H - 22;

      // Main PE Pipe
      html += `
        &lt;line x1=&quot;${BED_X - 20}&quot; y1=&quot;${pipeY}&quot; x2=&quot;${BED_X + BED_W - 15}&quot; y2=&quot;${pipeY}&quot; stroke=&quot;#0f172a&quot; stroke-width=&quot;7&quot; stroke-linecap=&quot;round&quot; /&gt;
        &lt;text x=&quot;${BED_X + 10}&quot; y=&quot;${pipeY + 16}&quot; font-size=&quot;11&quot; fill=&quot;#f8fafc&quot; font-weight=&quot;bold&quot;&gt;ท่อ PE 16/20 มม.&lt;/text&gt;
      `;

      // Emitters / Sprinklers
      if (state.system === &#x27;drip&#x27;) {
        treeCms.forEach(tCm =&gt; {
          const tx = BED_X + tCm * SCALE;
          const offsets = state.stage === &#x27;young&#x27;
            ? [[-18, 0], [18, 0]]
            : [[-32, 0], [32, 0], [0, -32], [0, 32]];
          offsets.forEach(([dx, dy]) =&gt; {
            const ex = tx + dx * SCALE;
            const ey = treeCy + dy * SCALE;
            html += `
              &lt;path d=&quot;M ${ex} ${pipeY} L ${ex} ${ey}&quot; stroke=&quot;#334155&quot; stroke-width=&quot;2&quot; fill=&quot;none&quot; /&gt;
              &lt;circle cx=&quot;${ex}&quot; cy=&quot;${ey}&quot; r=&quot;6&quot; fill=&quot;#0284c7&quot; stroke=&quot;#fff&quot; stroke-width=&quot;1.5&quot; /&gt;
            `;
          });
        });
      } else if (state.system === &#x27;360&#x27;) {
        treeCms.forEach((tCm, idx) =&gt; {
          const offsetCm = state.trees === 1 ? 18 : (idx === 0 ? 18 : -18);
          const sx = BED_X + (tCm + offsetCm) * SCALE;
          const valveY = pipeY - 32;
          html += `
            &lt;line x1=&quot;${sx}&quot; y1=&quot;${pipeY}&quot; x2=&quot;${sx}&quot; y2=&quot;${treeCy}&quot; stroke=&quot;#334155&quot; stroke-width=&quot;2.5&quot; /&gt;
            &lt;rect x=&quot;${sx - 6}&quot; y=&quot;${valveY - 8}&quot; width=&quot;12&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;#ef4444&quot; stroke=&quot;#fff&quot; stroke-width=&quot;1&quot; /&gt;
            &lt;circle cx=&quot;${sx}&quot; cy=&quot;${treeCy}&quot; r=&quot;8&quot; fill=&quot;#0284c7&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2&quot; /&gt;
            &lt;circle cx=&quot;${sx}&quot; cy=&quot;${treeCy}&quot; r=&quot;3&quot; fill=&quot;#fff&quot; /&gt;
          `;
        });
      } else if (state.system === &#x27;180&#x27;) {
        if (state.trees === 1) {
          const tx = BED_X + 115 * SCALE;
          html += `
            &lt;line x1=&quot;${tx}&quot; y1=&quot;${pipeY}&quot; x2=&quot;${tx}&quot; y2=&quot;${BED_Y + BED_H - 6}&quot; stroke=&quot;#334155&quot; stroke-width=&quot;2.5&quot; /&gt;
            &lt;path d=&quot;M ${tx - 9} ${BED_Y + BED_H - 6} A 9 9 0 0 1 ${tx + 9} ${BED_Y + BED_H - 6} Z&quot; fill=&quot;#0284c7&quot; stroke=&quot;#fff&quot; stroke-width=&quot;1.5&quot; /&gt;
            &lt;path d=&quot;M ${tx - 45} ${pipeY} L ${tx - 45} ${BED_Y + 6} L ${tx} ${BED_Y + 6}&quot; stroke=&quot;#334155&quot; stroke-width=&quot;2&quot; fill=&quot;none&quot; /&gt;
            &lt;path d=&quot;M ${tx - 9} ${BED_Y + 6} A 9 9 0 0 0 ${tx + 9} ${BED_Y + 6} Z&quot; fill=&quot;#0284c7&quot; stroke=&quot;#fff&quot; stroke-width=&quot;1.5&quot; /&gt;
          `;
        } else {
          treeCms.forEach(tCm =&gt; {
            const tx = BED_X + tCm * SCALE;
            html += `
              &lt;path d=&quot;M ${tx - 35} ${pipeY} L ${tx - 35} ${BED_Y + 6} L ${tx} ${BED_Y + 6}&quot; stroke=&quot;#334155&quot; stroke-width=&quot;2&quot; fill=&quot;none&quot; /&gt;
              &lt;path d=&quot;M ${tx - 9} ${BED_Y + 6} A 9 9 0 0 0 ${tx + 9} ${BED_Y + 6} Z&quot; fill=&quot;#0284c7&quot; stroke=&quot;#fff&quot; stroke-width=&quot;1.5&quot; /&gt;
            `;
          });
        }
      }

      html += drawCompanionPlants(treeCms, treeCy, pipeY);

      // Render main crops on top
      treeCms.forEach((tCm, i) =&gt; {
        const tx = BED_X + tCm * SCALE;
        html += `
          &lt;circle cx=&quot;${tx}&quot; cy=&quot;${treeCy}&quot; r=&quot;24&quot; fill=&quot;rgba(22, 163, 74, 0.35)&quot; stroke=&quot;#22c55e&quot; stroke-width=&quot;1.5&quot; /&gt;
          &lt;circle cx=&quot;${tx}&quot; cy=&quot;${treeCy}&quot; r=&quot;12&quot; fill=&quot;#16a34a&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2&quot; /&gt;
          &lt;text x=&quot;${tx}&quot; y=&quot;${treeCy - 30}&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;bold&quot; fill=&quot;#ffffff&quot; style=&quot;text-shadow: 0 1px 3px #000;&quot;&gt;${crop.mapName} #${i + 1} (${tCm} ซม.)&lt;/text&gt;
        `;
      });

      // Bottom Spacing Markers
      if (state.trees === 1) {
        const midX = BED_X + 115 * SCALE;
        html += `
          &lt;line x1=&quot;${BED_X}&quot; y1=&quot;${BED_Y + BED_H + 22}&quot; x2=&quot;${midX}&quot; y2=&quot;${BED_Y + BED_H + 22}&quot; stroke=&quot;#475569&quot; stroke-width=&quot;1.5&quot; /&gt;
          &lt;text x=&quot;${(BED_X + midX)/2}&quot; y=&quot;${BED_Y + BED_H + 38}&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;#334155&quot;&gt;115 ซม.&lt;/text&gt;
          &lt;line x1=&quot;${midX}&quot; y1=&quot;${BED_Y + BED_H + 22}&quot; x2=&quot;${BED_X + BED_W}&quot; y2=&quot;${BED_Y + BED_H + 22}&quot; stroke=&quot;#475569&quot; stroke-width=&quot;1.5&quot; /&gt;
          &lt;text x=&quot;${(midX + BED_X + BED_W)/2}&quot; y=&quot;${BED_Y + BED_H + 38}&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;#334155&quot;&gt;115 ซม.&lt;/text&gt;
        `;
      } else {
        const t1X = BED_X + 57.5 * SCALE;
        const t2X = BED_X + 172.5 * SCALE;
        html += `
          &lt;line x1=&quot;${BED_X}&quot; y1=&quot;${BED_Y + BED_H + 22}&quot; x2=&quot;${t1X}&quot; y2=&quot;${BED_Y + BED_H + 22}&quot; stroke=&quot;#475569&quot; stroke-width=&quot;1.5&quot; /&gt;
          &lt;text x=&quot;${(BED_X + t1X)/2}&quot; y=&quot;${BED_Y + BED_H + 38}&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;#334155&quot;&gt;57.5 ซม.&lt;/text&gt;
          &lt;line x1=&quot;${t1X}&quot; y1=&quot;${BED_Y + BED_H + 22}&quot; x2=&quot;${t2X}&quot; y2=&quot;${BED_Y + BED_H + 22}&quot; stroke=&quot;#475569&quot; stroke-width=&quot;1.5&quot; /&gt;
          &lt;text x=&quot;${(t1X + t2X)/2}&quot; y=&quot;${BED_Y + BED_H + 38}&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;#334155&quot;&gt;ระยะห่าง 115 ซม.&lt;/text&gt;
          &lt;line x1=&quot;${t2X}&quot; y1=&quot;${BED_Y + BED_H + 22}&quot; x2=&quot;${BED_X + BED_W}&quot; y2=&quot;${BED_Y + BED_H + 22}&quot; stroke=&quot;#475569&quot; stroke-width=&quot;1.5&quot; /&gt;
          &lt;text x=&quot;${(t2X + BED_X + BED_W)/2}&quot; y=&quot;${BED_Y + BED_H + 38}&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;#334155&quot;&gt;57.5 ซม.&lt;/text&gt;
        `;
      }

      svg.innerHTML = html;
      updateSpecs();
    }

    function updateSpecs() {
      const crop = CROPS[state.crop];
      const card = document.getElementById(&#x27;specs&#x27;);
      card.className = &#x27;specs-card&#x27; + (state.system !== &#x27;drip&#x27; ? &#x27; blue-theme&#x27; : &#x27;&#x27;);

      if (state.system === &#x27;drip&#x27;) {
        const totalHeads = state.trees * (state.stage === &#x27;young&#x27; ? 2 : 4);
        const dist = state.stage === &#x27;young&#x27; ? &#x27;15–20 ซม.&#x27; : &#x27;30–40 ซม.&#x27;;
        card.innerHTML = `
          &lt;h3&gt;ระบบน้ำหยด (${state.trees} ต้น / ${state.stage === &#x27;young&#x27; ? &#x27;ปลูกใหม่&#x27; : &#x27;ต้นโต&#x27;})&lt;/h3&gt;
          &lt;ul&gt;
            &lt;li&gt;&lt;strong&gt;จำนวนหัว:&lt;/strong&gt; &lt;strong&gt;${totalHeads} หัว&lt;/strong&gt; (รุ่นชดเชยแรงดัน 2 ลิตร/ชม.)&lt;/li&gt;
            &lt;li&gt;&lt;strong&gt;ระยะปัก:&lt;/strong&gt; ห่างโคน${crop.mapName} &lt;strong&gt;${dist}&lt;/strong&gt;&lt;/li&gt;
            &lt;li&gt;&lt;strong&gt;จุดเด่น:&lt;/strong&gt; จ่ายน้ำบริเวณโคนพืชหลักโดยตรง หากพืชแซมอยู่นอกบริเวณดินชื้นให้จัดหัวน้ำหยดเพิ่ม&lt;/li&gt;
          &lt;/ul&gt;
        `;
      } else if (state.system === &#x27;360&#x27;) {
        const diam = state.trees === 1 ? &#x27;90–100 ซม.&#x27; : &#x27;80–85 ซม.&#x27;;
        card.innerHTML = `
          &lt;h3&gt;มินิสปริงเกอร์ 360° (${state.trees} ต้น)&lt;/h3&gt;
          &lt;ul&gt;
            &lt;li&gt;&lt;strong&gt;จำนวนหัว:&lt;/strong&gt; &lt;strong&gt;${state.trees} หัว&lt;/strong&gt; ปักเยื้องโคนต้น 15–20 ซม. (ก้านเตี้ย 10–15 ซม.)&lt;/li&gt;
            &lt;li&gt;&lt;strong&gt;การคุมรัศมี:&lt;/strong&gt; ติด &lt;strong&gt;มินิวาล์วหรี่น้ำ&lt;/strong&gt; คุมวงน้ำไม่เกิน &lt;strong&gt;${diam}&lt;/strong&gt;&lt;/li&gt;
            &lt;li&gt;&lt;strong&gt;ข้อดีเมื่อปลูกพืชแซม:&lt;/strong&gt; ตรวจจุดที่น้ำไปไม่ถึงและปรับตำแหน่งหัวจ่ายตามสภาพแปลง&lt;/li&gt;
          &lt;/ul&gt;
        `;
      } else {
        card.innerHTML = `
          &lt;h3&gt;มินิสปริงเกอร์ 180° (${state.trees} ต้น)&lt;/h3&gt;
          &lt;ul&gt;
            &lt;li&gt;&lt;strong&gt;จำนวนหัว:&lt;/strong&gt; &lt;strong&gt;2 หัว&lt;/strong&gt; ปักขอบแปลงหันเข้าหากลางแปลง&lt;/li&gt;
            &lt;li&gt;&lt;strong&gt;การตั้งค่า:&lt;/strong&gt; หรี่รัศมีไม่เกิน 60–65 ซม. ไม่ให้น้ำล้นขอบแปลง 1 เมตร&lt;/li&gt;
          &lt;/ul&gt;
        `;
      }

      const compCard = document.getElementById(&#x27;companion-specs&#x27;);
      if (state.selectedPlants.length === 0) {
        compCard.innerHTML = `
          &lt;h3&gt;ปลูก${crop.name}ล้วน (ไม่ปลูกพืชแซม)&lt;/h3&gt;
          &lt;ul&gt;
            &lt;li&gt;&lt;strong&gt;ข้อดี:&lt;/strong&gt; โล่ง โปร่ง อากาศถ่ายเทดี ดูแลทรงพุ่มและใส่ปุ๋ยโคนต้นได้สะดวกที่สุด&lt;/li&gt;
            &lt;li&gt;&lt;strong&gt;คำแนะนำ:&lt;/strong&gt; สามารถใช้ฟางข้าวหรือใบไม้แห้งคลุมโคนต้นบางๆ แทนได้&lt;/li&gt;
          &lt;/ul&gt;
        `;
      } else {
        const totalPlants = state.selectedPlants.reduce(
          (total, id) =&gt; total + plantCount(id, defaultPlantCount(id)), 0
        );
        const itemsHtml = state.selectedPlants.map(id =&gt; {
          const p = PLANT_CATALOG.find(item =&gt; item.id === id);
          return `&lt;li&gt;&lt;strong&gt;${p.name} (${plantCount(id, defaultPlantCount(id))} ต้น)&lt;/strong&gt; — ${p.role}&lt;/li&gt;`;
        }).join(&#x27;&#x27;);
        compCard.innerHTML = `
          &lt;h3&gt;พืชแซมที่เลือกไว้ (${state.selectedPlants.length} ชนิด รวม ${totalPlants} ต้น)&lt;/h3&gt;
          &lt;ul&gt;
            ${itemsHtml}
            &lt;li&gt;&lt;strong&gt;ก่อนลงปลูก:&lt;/strong&gt; จัดมะละกอและตะไคร้ให้มีพื้นที่ขยายทรงพุ่มหรือกอ ตรวจระยะจริงตามพันธุ์ที่ใช้&lt;/li&gt;
          &lt;/ul&gt;
        `;
      }
    }

    initPlantMenu();
    render();
    document.getElementById(&#x27;export-pdf&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; window.print());
  &lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;
"></iframe>

  <script>
    const tabs = [...document.querySelectorAll('[role="tab"]')];
    const panelFor = tab => document.getElementById(tab.getAttribute('aria-controls'));
    const frames = [...document.querySelectorAll('iframe')];

    function fitFrame(frame) {
      const body = frame.contentDocument?.body;
      if (!body || frame.closest('[hidden]')) return;
      frame.style.height = Math.ceil(body.getBoundingClientRect().height) + 'px';
    }

    function showTab(selected) {
      for (const tab of tabs) {
        const active = tab === selected;
        tab.setAttribute('aria-selected', String(active));
        tab.tabIndex = active ? 0 : -1;
        panelFor(tab).hidden = !active;
      }
      fitFrame(panelFor(selected).querySelector('iframe'));
    }

    for (const frame of frames) {
      function watchSize() {
        const body = frame.contentDocument?.body;
        if (!body || body === frame.observedBody) return;
        frame.observedBody = body;
        frame.sizeObserver?.disconnect();
        frame.sizeObserver = new ResizeObserver(() => fitFrame(frame));
        frame.sizeObserver.observe(body);
        fitFrame(frame);
      }
      frame.addEventListener('load', watchSize);
      watchSize();
    }

    tabs.forEach((tab, index) => {
      tab.addEventListener('click', () => showTab(tab));
      tab.addEventListener('keydown', event => {
        const next = {
          ArrowRight: (index + 1) % tabs.length,
          ArrowLeft: (index - 1 + tabs.length) % tabs.length,
          Home: 0,
          End: tabs.length - 1
        }[event.key];
        if (next === undefined) return;
        event.preventDefault();
        showTab(tabs[next]);
        tabs[next].focus();
      });
    });
  </script>
